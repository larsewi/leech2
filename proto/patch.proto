syntax = "proto3";

package patch;

import "cell.proto";
import "injected.proto";
import "table.proto";
import "google/protobuf/timestamp.proto";

// Patch represents the result of merging one or more blocks in the chain.
// It can contain consolidated deltas and/or full state snapshots per table.
message Patch {
  // The hash of the most recent block in the chain (referenced in HEAD).
  string head = 1;
  // Timestamp when the HEAD block was created.
  google.protobuf.Timestamp created = 2;
  // Static fields injected into all SQL output (extra columns in INSERT, conditions in WHERE).
  repeated injected.Field injected_fields = 3;
  // The number of blocks that were merged to produce this patch.
  uint32 num_blocks = 4;
  // Tables with incremental changes (key = table name).
  map<string, Delta> deltas = 5;
  // Tables requiring a full state snapshot (key = table name).
  map<string, table.Table> states = 6;
}

// Delta represents the consolidated changes to a single table, as sent to the
// hub. Field tags match block.Delta.
message Delta {
  // The primary-key field names, in tuple order.
  repeated string primary_key_names = 1;
  // The subsidiary (non-key) field names, in tuple order.
  repeated string subsidiary_value_names = 2;
  // Records that were added (new keys).
  repeated Insert inserts = 3;
  // Records that were removed (keys no longer present).
  repeated Delete deletes = 4;
  // Records that were modified (existing keys with changed values).
  repeated Update updates = 5;
}

// Insert represents a record added to a table.
message Insert {
  // The cells that make up the composite primary key.
  repeated cell.Cell key = 1;
  // The subsidiary (non-key) cells.
  repeated cell.Cell value = 2;
  // Creation time of the last block that changed this record. Only set for
  // tables with change-timestamp.
  optional google.protobuf.Timestamp change_timestamp = 3;
}

// Delete represents a record removed from a table. Only the key is needed.
message Delete {
  // The cells that make up the composite primary key.
  repeated cell.Cell key = 1;
  // Tag 2 held the deleted value when deletes were a record.Record. Patches
  // never set it.
  reserved 2;
}

// Update represents a row whose subsidiary (non-key) cells changed.
message Update {
  // The cells that make up the composite primary key.
  repeated cell.Cell key = 1;
  // Indices into the parent Delta's subsidiary fields identifying which
  // columns changed. Empty means all columns changed.
  repeated uint32 changed_indices = 2;
  // Tag 3 held old_value when blocks and patches shared one Update message.
  // Patches never set it.
  reserved 3;
  // The subsidiary cells after the change: one per entry in changed_indices,
  // or one per subsidiary field when changed_indices is empty.
  repeated cell.Cell new_value = 4;
  // Creation time of the last block that changed this record. Only set for
  // tables with change-timestamp.
  optional google.protobuf.Timestamp change_timestamp = 5;
}
