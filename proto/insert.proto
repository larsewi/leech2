syntax = "proto3";

package insert;

import "cell.proto";
import "google/protobuf/timestamp.proto";

// Insert represents a record added to a table. Uses the same field tags as
// record.Record, so the two are wire-compatible.
message Insert {
  // The cells that make up the composite primary key.
  repeated cell.Cell key = 1;
  // The subsidiary (non-key) cells.
  repeated cell.Cell value = 2;
  // Creation time of the last block that changed this record. Only set in
  // patches, for tables with change-timestamp. Never set in blocks.
  optional google.protobuf.Timestamp change_timestamp = 3;
}
