name: Release

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - name: Read version from Cargo.toml
        id: version
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Releasing version: ${VERSION}"

      - name: Check tag does not already exist
        run: |
          if git ls-remote --exit-code --tags origin "v${{ steps.version.outputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag v${{ steps.version.outputs.version }} already exists"
            exit 1
          fi

  source:
    needs: [validate, man]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install protobuf compiler
        uses: ./.github/actions/setup-protoc

      # Download outside the checkout: 'cargo package' refuses to run with
      # uncommitted files in the working tree, and with --allow-dirty it would
      # pack them into the crate as well.
      - name: Download man pages
        uses: actions/download-artifact@v8
        with:
          name: man-pages
          path: ${{ runner.temp }}/man-pages

      # The man pages are generated, so 'cargo package' cannot include them:
      # unpack the .crate, add them under man/, and repack.
      - name: Create source tarball
        run: |
          DIR="leech2-${{ needs.validate.outputs.version }}"
          cargo package
          tar xzf "target/package/${DIR}.crate"
          mkdir "${DIR}/man"
          cp "${RUNNER_TEMP}/man-pages/"*.1 "${RUNNER_TEMP}/man-pages/"*.3 "${DIR}/man/"
          tar czf "${DIR}.tar.gz" "${DIR}"

      # Artifacts named 'release-*' are attached to the GitHub release; see the
      # download step in the 'release' job.
      - name: Upload source tarball
        uses: actions/upload-artifact@v7
        with:
          name: release-source-tarball
          path: leech2-*.tar.gz

  man:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen

      - name: Generate man pages
        run: cargo xtask generate-man-pages man-pages

      # Deliberately not named 'release-*': the man pages ship inside the .deb,
      # .rpm and source tarball, not as standalone release assets. This artifact
      # only carries them to the jobs that package them.
      - name: Upload man pages
        uses: actions/upload-artifact@v7
        with:
          name: man-pages
          path: man-pages/

  build:
    needs: [validate, man]
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            artifact: linux-x86_64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            artifact: linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-15-intel
            artifact: macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-15
            artifact: macos-aarch64
          - target: x86_64-pc-windows-msvc
            os: windows-2025-vs2026
            artifact: windows-x86_64
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            artifact: windows-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - name: Install protobuf compiler
        uses: ./.github/actions/setup-protoc

      - name: Add Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      # Only the .deb and .rpm ship man pages, so only Linux needs them.
      - name: Download man pages
        if: runner.os == 'Linux'
        uses: actions/download-artifact@v8
        with:
          name: man-pages
          path: target/${{ matrix.target }}/release/man

      - name: Package .deb
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deb --locked
          cargo deb --no-build --target ${{ matrix.target }}

      - name: Package .rpm
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-generate-rpm --locked
          cargo generate-rpm --target ${{ matrix.target }}

      - name: Package .msi
        if: runner.os == 'Windows' && matrix.target != 'aarch64-pc-windows-msvc'
        run: |
          cargo install cargo-wix --locked
          # cargo-wix refuses to guess a package in a workspace, so name it.
          cargo wix --package leech2 --no-build --nocapture --target ${{ matrix.target }}

      - name: Determine file extensions
        id: ext
        shell: bash
        run: |
          case "${{ runner.os }}" in
            macOS)   echo "lib=libleech2.dylib" >> "$GITHUB_OUTPUT"; echo "bin=lch" >> "$GITHUB_OUTPUT" ;;
            Windows) echo "lib=leech2.dll" >> "$GITHUB_OUTPUT"; echo "bin=lch.exe" >> "$GITHUB_OUTPUT" ;;
            *)       echo "lib=libleech2.so" >> "$GITHUB_OUTPUT"; echo "bin=lch" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Create tarball
        if: runner.os != 'Windows'
        run: |
          DIR="leech2-${{ needs.validate.outputs.version }}-${{ matrix.artifact }}"
          mkdir -p "dist/${DIR}"
          cp "target/${{ matrix.target }}/release/${{ steps.ext.outputs.bin }}" "dist/${DIR}/"
          cp "target/${{ matrix.target }}/release/${{ steps.ext.outputs.lib }}" "dist/${DIR}/"
          cp include/leech2.h "dist/${DIR}/"
          cp README.md "dist/${DIR}/"
          cp LICENSE "dist/${DIR}/"
          tar czf "dist/${DIR}.tar.gz" -C dist "${DIR}"

      - name: Create zip
        if: runner.os == 'Windows'
        shell: bash
        run: |
          DIR="leech2-${{ needs.validate.outputs.version }}-${{ matrix.artifact }}"
          mkdir -p "dist/${DIR}"
          cp "target/${{ matrix.target }}/release/${{ steps.ext.outputs.bin }}" "dist/${DIR}/"
          cp "target/${{ matrix.target }}/release/${{ steps.ext.outputs.lib }}" "dist/${DIR}/"
          cp include/leech2.h "dist/${DIR}/"
          cp README.md "dist/${DIR}/"
          cp LICENSE "dist/${DIR}/"
          cd dist && 7z a "${DIR}.zip" "${DIR}"

      - name: Upload tarball
        if: runner.os != 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.artifact }}-tarball
          path: dist/*.tar.gz

      - name: Upload zip
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.artifact }}-zip
          path: dist/*.zip

      - name: Upload .deb
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.artifact }}-deb
          path: target/${{ matrix.target }}/debian/*.deb

      - name: Upload .rpm
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.artifact }}-rpm
          path: target/${{ matrix.target }}/generate-rpm/*.rpm

      - name: Upload .msi
        if: runner.os == 'Windows' && matrix.target != 'aarch64-pc-windows-msvc'
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.artifact }}-msi
          path: target/wix/*.msi

  release:
    needs: [validate, source, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download release assets
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          pattern: release-*
          merge-multiple: true

      - name: Scan release assets for viruses
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav
          sudo systemctl stop clamav-freshclam
          sudo freshclam
          clamscan --recursive --infected release-assets/

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum * > checksums.txt

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ needs.validate.outputs.version }}" \
            --title "leech2 v${{ needs.validate.outputs.version }}" \
            --generate-notes \
            release-assets/*
