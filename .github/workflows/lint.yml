name: Lint

on:
  pull_request:
    branches: ["master"]
  workflow_dispatch: # Allows manual triggering

jobs:
  rust:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Cache cargo
        uses: ./.github/actions/cargo-cache
        with:
          profile: debug

      - name: Install protobuf compiler
        uses: ./.github/actions/setup-protoc

      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings

  c:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Run cppcheck
        run: |
          sudo apt-get update && sudo apt-get install -y cppcheck
          FILES=$(find . -path ./target -prune -o \( -name '*.c' -o -name '*.h' \) -print)
          if [ -n "$FILES" ]; then
            echo "$FILES" | xargs cppcheck --error-exitcode=1 --enable=warning,style,performance,portability
          fi

  shell:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Run shellcheck
        run: |
          FILES=$(find . -path ./target -prune -o -name '*.sh' -print)
          if [ -n "$FILES" ]; then
            echo "$FILES" | xargs shellcheck
          fi

  ascii:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check for non-ASCII characters
        run: |
          FILES=$(git ls-files '*.rs' '*.c' '*.h' '*.cpp' '*.proto' '*.sh' '*.yml' '*.md' ':!:CLAUDE.md')
          if [ -n "$FILES" ]; then
            if echo "$FILES" | xargs grep -nPI '[^\x00-\x7F]'; then
              echo "Found non-ASCII characters on the lines above. Use ASCII equivalents such as '->' and '--'."
              exit 1
            fi
          fi
